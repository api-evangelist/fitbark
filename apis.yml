aid: fitbark
name: FitBark
description: >-
  FitBark makes GPS and health-monitoring wearables for dogs and offers the FitBark
  Public API (v2), an OAuth 2.0 REST API that lets developers integrate FitBark
  activity and health data into third-party mobile and web applications. The API
  exposes a dog's activity series and totals, time-at-activity-level breakdowns,
  daily activity-point goals, similar-dog statistics, related users and dogs, and
  Base64/JPEG profile pictures. Approved developers receive a client_id and
  client_secret and authenticate with the OAuth 2.0 authorization_code and
  client_credentials grants (base host https://app.fitbark.com). FitBark was a
  Techstars portfolio company; this profile was enriched by API Evangelist from
  FitBark's official published developer documentation and Postman collection.
