  style: date-range
  detail: >-
    Time-series endpoints (activity_series, activity_totals, time_breakdown) are
    bounded by from/to date parameters rather than cursor/offset paging. Maximum
    range is 42 days at DAILY resolution and 7 days at HOURLY resolution.
  params: [from, to, resolution]
resource_identifier:
  scheme: slug
  detail: Dogs and users are addressed by an opaque `slug` string (dog_slug / user_slug).
