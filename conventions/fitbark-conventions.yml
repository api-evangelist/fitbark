  current: v2
  detail: The API version is embedded in the path (/api/v2/...).
  ref: lifecycle/fitbark-lifecycle.yml
request_body:
  media_type: application/json
  detail: >-
    Several read operations use POST with a JSON body (activity_series wraps its
    fields under an `activity_series` object; activity_totals and time_breakdown
