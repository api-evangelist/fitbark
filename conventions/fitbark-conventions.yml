authentication:
  style: oauth2-bearer
  detail: >-
    OAuth 2.0. Approved developers receive a client_id and client_secret. An
    application (open-API) token is obtained via the client_credentials grant; a
    user access token via the authorization_code grant. All API calls carry the
    token as an Authorization: Bearer header.
  ref: authentication/fitbark-authentication.yml
idempotency:
  supported: false
  note: FitBark documents no idempotency-key mechanism.
